<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabal Field Boss Tracker 1.0 (DEV)</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            
            --accent-map: #38bdf8;
            --accent-boss: #a855f7;
            --accent-channel: #10b981;
            --accent-kill: #eab308;
            --accent-force: #3b82f6;
            --accent-test: #8b5cf6;
            --accent-danger: #ef4444;
            
            --transition-speed: 0.3s;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1f293d 0%, var(--bg-color) 70%);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h2, h3 { text-align: center; font-weight: 600; letter-spacing: 1px; color: var(--text-primary); text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        .button-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

        button { border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(10px); outline: none; }

        .map-btn { background-color: rgba(30, 41, 59, 0.6); color: var(--text-primary); }
        .map-btn:hover { background-color: rgba(56, 189, 248, 0.15); border-color: var(--accent-map); color: var(--accent-map); transform: translateY(-2px); }
        .map-btn.active { background-color: var(--accent-map); color: #0f172a; border-color: var(--accent-map); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }

        .wrapper { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); max-height: 0; opacity: 0; overflow: hidden; margin-top: 0; padding-top: 0; padding-bottom: 0; border-width: 0; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .wrapper.visible { max-height: 500px; opacity: 1; padding: 20px; border-width: 1px; margin-top: 10px; }

        .boss-btn { background-color: rgba(45, 27, 105, 0.4); color: #e9d5ff; border-color: rgba(168, 85, 247, 0.2); }
        .boss-btn:hover { background-color: rgba(168, 85, 247, 0.2); border-color: var(--accent-boss); color: #ffffff; transform: translateY(-2px); }
        .boss-btn.active { background-color: var(--accent-boss); color: #ffffff; border-color: var(--accent-boss); box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }

        .channel-btn { background-color: rgba(6, 78, 59, 0.4); color: #d1fae5; border-color: rgba(16, 185, 129, 0.2); padding: 8px 14px; font-size: 13px; position: relative; }
        .channel-btn:hover { background-color: var(--accent-channel); color: #022c22; border-color: var(--accent-channel); box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); transform: translateY(-1px); }
        .channel-btn.active { background-color: var(--accent-channel); color: #022c22; border-color: var(--accent-channel); box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
        .channel-btn.has-spawn { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        .channel-btn.has-spawn::after { content: ''; position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; background-color: #38bdf8; border-radius: 50%; box-shadow: 0 0 6px #38bdf8; }

        .table-section { margin-top: 30px; background: var(--panel-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .table-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .table-header-row h3 { margin: 0; text-align: left; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { color: var(--text-secondary); font-weight: 600; background-color: rgba(255, 255, 255, 0.02); }
        tr:hover td { background-color: rgba(255, 255, 255, 0.02); }
        tr.missed-row td { background-color: rgba(239, 68, 68, 0.05); }
        .missed-badge { background-color: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); padding: 2px 6px; font-size: 11px; border-radius: 4px; margin-left: 8px; font-weight: 600; display: inline-block; }
        .timer-cell { font-family: monospace; font-size: 15px; font-weight: 600; color: #38bdf8; }
        .timer-cell.negative { color: var(--accent-danger); }
        
        .kill-btn, .force-btn, .test-btn, .delete-btn { padding: 5px 10px; font-size: 12px; border-radius: 6px; margin-right: 4px; margin-bottom: 4px; }
        .kill-btn { background-color: rgba(234, 179, 8, 0.2); color: #fef08a; border: 1px solid rgba(234, 179, 8, 0.4); }
        .kill-btn:hover { background-color: var(--accent-kill); color: #713f12; }
        .force-btn { background-color: rgba(59, 130, 246, 0.2); color: #bfdbfe; border: 1px solid rgba(59, 130, 246, 0.4); }
        .force-btn:hover:not(:disabled) { background-color: var(--accent-force); color: #ffffff; }
        .force-btn:disabled { background-color: rgba(255, 255, 255, 0.03); color: var(--text-secondary); cursor: not-allowed; opacity: 0.5; }
        .test-btn { background-color: rgba(139, 92, 246, 0.2); color: #ddd6fe; border: 1px solid rgba(139, 92, 246, 0.4); }
        .test-btn:hover { background-color: var(--accent-test); color: #ffffff; }
        .delete-btn { background-color: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .delete-btn:hover { background-color: var(--accent-danger); color: #ffffff; }
        .empty-table { text-align: center; color: var(--text-secondary); padding: 20px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cabal Field Boss Tracker 1.0 (DEV)</h2>
        <div id="mapContainer" class="button-row"></div>
        <div id="bossWrapper" class="wrapper">
            <div id="bossContainer" class="button-row"></div>
            <div id="channelWrapper" class="wrapper">
                <div id="channelContainer" class="button-row"></div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header-row"><h3>Active Spawns Tracker (DEV)</h3></div>
            <table>
                <thead>
                    <tr><th>Map</th><th>Boss</th><th>Channel</th><th>Spawntimer</th><th>Aktion</th></tr>
                </thead>
                <tbody id="trackerTableBody">
                    <tr><td colspan="5" class="empty-table">Keine aktiven Einträge. Wähle Map -> Boss -> Channel aus.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
