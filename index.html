<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabal Field Boss Tracker 1.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #06080c;
            --panel-bg: rgba(13, 17, 23, 0.75);
            --panel-border: rgba(255, 255, 255, 0.07);
            --panel-border-glow: rgba(56, 189, 248, 0.25);
            
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            
            --accent-map: #0ea5e9;
            --accent-boss: #a855f7;
            --accent-channel: #10b981;
            --accent-kill: #eab308;
            --accent-force: #3b82f6;
            --accent-danger: #f43f5e;
            
            --transition-smooth: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(14, 165, 233, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(168, 85, 247, 0.06) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0b0f17 0%, var(--bg-color) 100%);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h2 {
            text-align: center;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 1.75rem;
            margin-bottom: 30px;
            text-shadow: 0 0 25px rgba(14, 165, 233, 0.25);
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h3 {
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--text-primary);
            font-size: 1.1rem;
        }

        .container {
            max-width: 1300px; /* Erhöht für mehr Platz */
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .button-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        /* Basis-Buttons */
        button {
            border: 1px solid var(--panel-border);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            font-family: 'Outfit', sans-serif;
            transition: var(--transition-smooth);
            backdrop-filter: blur(12px);
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Map Buttons */
        .map-btn {
            background: rgba(15, 23, 42, 0.6);
            color: var(--text-secondary);
            border-color: rgba(255, 255, 255, 0.05);
        }
        .map-btn:hover {
            background: rgba(14, 165, 233, 0.1);
            border-color: rgba(14, 165, 233, 0.4);
            color: var(--accent-map);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.15);
        }
        .map-btn.active {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: #ffffff;
            border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.4);
            font-weight: 600;
        }

        /* Wrapper Animation */
        .wrapper {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 0;
            border-radius: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            margin-top: 0;
            border-width: 0;
            transition: var(--transition-smooth);
        }
        .wrapper.visible {
            max-height: 600px;
            opacity: 1;
            padding: 22px;
            border-width: 1px;
            border-color: var(--panel-border);
            margin-top: 4px;
        }

        /* Boss Buttons */
        .boss-btn {
            background: rgba(30, 27, 75, 0.4);
            color: #d8b4fe;
            border-color: rgba(168, 85, 247, 0.15);
        }
        .boss-btn:hover {
            background: rgba(168, 85, 247, 0.2);
            border-color: rgba(168, 85, 247, 0.5);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.2);
        }
        .boss-btn.active {
            background: linear-gradient(135deg, #9333ea, #a855f7);
            color: #ffffff;
            border-color: #c084fc;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            font-weight: 600;
        }

        /* Channel Buttons */
        .channel-btn {
            background: rgba(6, 78, 59, 0.3);
            color: #a7f3d0;
            border-color: rgba(16, 185, 129, 0.15);
            padding: 8px 14px;
            font-size: 13px;
            position: relative;
        }
        .channel-btn:hover {
            background: rgba(16, 185, 129, 0.25);
            border-color: var(--accent-channel);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
            transform: translateY(-1px);
        }
        .channel-btn.active {
            background: linear-gradient(135deg, #059669, #10b981);
            color: #ffffff;
            border-color: #34d399;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            font-weight: 600;
        }
        .channel-btn.has-spawn {
            border-color: var(--accent-map);
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
        }
        .channel-btn.has-spawn::after {
            content: '';
            position: absolute;
            top: -4px;
            right: -4px;
            width: 8px;
            height: 8px;
            background-color: var(--accent-map);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-map);
        }

        /* Table Section */
        .table-section {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            padding: 24px;
            border-radius: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            overflow-x: auto;
        }
        .table-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--panel-border);
        }
        .table-header-row h3 {
            margin: 0;
            text-align: left;
        }
        
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            text-align: left;
        }
        th, td {
            padding: 14px 16px;
            font-size: 13.5px;
            white-space: nowrap; /* Verhindert jegliche Zeilenumbrüche innerhalb von Zellen */
        }
        th {
            color: var(--text-secondary);
            font-weight: 600;
            background-color: rgba(255, 255, 255, 0.015);
            border-bottom: 1px solid var(--panel-border);
            text-transform: uppercase;
            font-size: 11.5px;
            letter-spacing: 0.8px;
        }
        th:first-child { border-top-left-radius: 8px; }
        th:last-child { border-top-right-radius: 8px; }

        tr td {
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s ease;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background-color: rgba(255, 255, 255, 0.025);
        }
        tr.missed-row td {
            background-color: rgba(244, 63, 94, 0.04);
        }
        tr.missed-row:hover td {
            background-color: rgba(244, 63, 94, 0.08);
        }
        
        .missed-badge {
            background-color: rgba(244, 63, 94, 0.15);
            color: #fda4af;
            border: 1px solid rgba(244, 63, 94, 0.3);
            padding: 3px 8px;
            font-size: 11px;
            border-radius: 6px;
            margin-left: 10px;
            font-weight: 600;
            display: inline-block;
            letter-spacing: 0.3px;
            vertical-align: middle;
        }
        .missed-count-badge {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--panel-border);
            font-weight: 600;
            font-size: 12px;
            color: #cbd5e1;
        }
        
        .timestamp-cell {
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: var(--text-secondary);
        }
        .timer-cell {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14.5px;
            font-weight: 600;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        .timer-cell.negative {
            color: var(--accent-danger);
            text-shadow: 0 0 12px rgba(244, 63, 94, 0.3);
        }
        
        .action-cell {
            white-space: nowrap;
        }
        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: nowrap;
        }
        
        /* Action Buttons - Ausrichtung & Größen */
        .kill-btn, .force-btn, .delete-btn {
            border-radius: 6px;
            margin: 0;
            font-weight: 600;
        }
        
        /* Etwas größerer Kill-Button für optimales Klicken */
        .kill-btn {
            padding: 8px 16px;
            font-size: 13px;
            background-color: rgba(234, 179, 8, 0.15);
            color: #fde047;
            border: 1px solid rgba(234, 179, 8, 0.3);
        }
        .kill-btn:hover {
            background-color: var(--accent-kill);
            color: #422006;
            box-shadow: 0 0 12px rgba(234, 179, 8, 0.4);
        }
        
        .force-btn {
            padding: 7px 12px;
            font-size: 12px;
            background-color: rgba(59, 130, 246, 0.15);
            color: #93c5fd;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }
        .force-btn:hover:not(:disabled) {
            background-color: var(--accent-force);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
        }
        .force-btn:disabled {
            background-color: rgba(255, 255, 255, 0.02);
            color: #475569;
            border-color: rgba(255, 255, 255, 0.03);
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .delete-btn {
            padding: 7px 12px;
            font-size: 12px;
            background-color: rgba(244, 63, 94, 0.15);
            color: #fda4af;
            border: 1px solid rgba(244, 63, 94, 0.3);
        }
        .delete-btn:hover {
            background-color: var(--accent-danger);
            color: #ffffff;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.4);
        }
        
        .empty-table {
            text-align: center;
            color: var(--text-secondary);
            padding: 30px;
            font-style: italic;
            white-space: normal;
        }

        /* Scrollbar Optimierung */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(6, 8, 12, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cabal Field Boss Tracker 1.1</h2>
        <div id="mapContainer" class="button-row"></div>
        <div id="bossWrapper" class="wrapper">
            <div id="bossContainer" class="button-row"></div>
            <div id="channelWrapper" class="wrapper">
                <div id="channelContainer" class="button-row"></div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header-row">
                <h3>Active Spawn Tracker</h3>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Map</th>
                        <th>Boss</th>
                        <th>Channel</th>
                        <th>Missed Count</th>
                        <th>Letzter Kill</th>
                        <th>Spawntimer</th>
                        <th>Aktion</th>
                    </tr>
                </thead>
                <tbody id="trackerTableBody">
                    <tr><td colspan="7" class="empty-table">Keine aktiven Einträge. Wähle Map -> Boss -> Channel aus.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    const SUPABASE_URL = 'https://hrduuxzogmhasjtjcfdx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyZHV1eHpvZ21oYXNqdGpjZmR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4OTA3MzQsImV4cCI6MjEwMjQ2NjczNH0.nFMhl4WBlZhIW4HJbK5FH5swY9YrSdMBL5bYzii2NQ0';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const cabalData = {
        "Forgotten Ruin": [{ name: "Distichous Mongrel" }, { name: "Ancient Cockatrice" }, { name: "Monakus Karion" }, { name: "Virulent Cauda" }],
        "Lakeside": [{ name: "Berderk Faello" }],
        "Pontus Ferrum": [{ name: "TA-01 Gravis Rota (oben)" }, { name: "TA-01 Gravis Rota (unten)" }, { name: "MA-06 Quadra" }, { name: "FP-01 Magnus Penna (oben)" }, { name: "FP-01 Magnus Penna (unten)" }, { name: "UMD-03 Lautus Pluma" }],
        "Porta Inferno": [{ name: "Manticore" }, { name: "Dark Kimzark" }, { name: "Keshapone Minisha" }],
        "Senillinea": [{ name: "Enthiud (Enthuid)" }, { name: "Giant Wolf Leader" }, { name: "Meer King" }, { name: "Lesser Panda King" }]
    };

    const mapContainer = document.getElementById('mapContainer');
    const bossWrapper = document.getElementById('bossWrapper');
    const bossContainer = document.getElementById('bossContainer');
    const channelWrapper = document.getElementById('channelWrapper');
    const channelContainer = document.getElementById('channelContainer');
    const trackerTableBody = document.getElementById('trackerTableBody');

    let activeMapButton = null, activeBossButton = null, activeChannelButton = null;
    let currentSelectedMap = null, currentSelectedBoss = null;
    let activeEntries = [];
    const channelButtonMap = {};

    async function fetchSpawns() {
        console.log("Lade Daten von Supabase...");
        const { data, error } = await _supabase.from('boss_spawns_2').select('*').range(0, 999);
        
        if (error) {
            console.error("Supabase Fehler:", error);
            return;
        }

        if (data) {
            activeEntries = data.map(item => ({
                id: item.id, 
                map: item.map, 
                boss: item.boss, 
                channel: item.channel,
                endTime: item.end_time ? new Date(item.end_time).getTime() : 0, 
                lastKillTime: item.last_kill_time ? new Date(item.last_kill_time).getTime() : 0,
                isMissed: item.is_missed || false,
                missedCount: item.missed_count || 0
            }));
            rebuildTable();
        }
    }

    _supabase.channel('public:boss_spawns_2').on('postgres_changes', { event: '*', schema: 'public', table: 'boss_spawns_2' }, () => { fetchSpawns(); }).subscribe();

    for (let i = 1; i <= 15; i++) {
        const chBtn = document.createElement('button');
        chBtn.className = 'channel-btn';
        chBtn.innerText = `Ch. ${i}`;
        const channelName = `Channel ${i}`;
        chBtn.dataset.channel = channelName;
        channelButtonMap[channelName] = chBtn;
        chBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (activeChannelButton) activeChannelButton.classList.remove('active');
            chBtn.classList.add('active');
            activeChannelButton = chBtn;
            const nowIso = new Date().toISOString();
            const fourHoursLater = new Date(Date.now() + (4 * 60 * 60 * 1000)).toISOString();
            await _supabase.from('boss_spawns_2').upsert({ 
                map: currentSelectedMap, boss: currentSelectedBoss, channel: channelName, 
                end_time: fourHoursLater, last_kill_time: nowIso, is_missed: false, missed_count: 0 
            }, { onConflict: 'map,boss,channel' });
        });
        channelContainer.appendChild(chBtn);
    }

    Object.keys(cabalData).forEach(mapName => {
        const mapBtn = document.createElement('button');
        mapBtn.className = 'map-btn';
        mapBtn.innerText = mapName;
        mapBtn.addEventListener('click', () => {
            if (activeMapButton === mapBtn) {
                bossWrapper.classList.remove('visible'); channelWrapper.classList.remove('visible'); mapBtn.classList.remove('active');
                activeMapButton = null; activeBossButton = null; activeChannelButton = null;
                currentSelectedMap = null; currentSelectedBoss = null; updateChannelHighlights(); return;
            }
            if (activeMapButton) activeMapButton.classList.remove('active');
            mapBtn.classList.add('active'); activeMapButton = mapBtn; currentSelectedMap = mapName;
            bossContainer.innerHTML = '';
            cabalData[mapName].forEach(boss => {
                const bossBtn = document.createElement('button');
                bossBtn.className = 'boss-btn';
                bossBtn.innerText = boss.name;
                bossBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (activeBossButton) activeBossButton.classList.remove('active');
                    bossBtn.classList.add('active'); activeBossButton = bossBtn; currentSelectedBoss = boss.name;
                    channelWrapper.classList.add('visible'); updateChannelHighlights();
                });
                bossContainer.appendChild(bossBtn);
            });
            bossWrapper.classList.add('visible');
        });
        mapContainer.appendChild(mapBtn);
    });

    window.killTimer = async function(id) {
        const nowIso = new Date().toISOString();
        const fourHoursLater = new Date(Date.now() + (4 * 60 * 60 * 1000)).toISOString();
        await _supabase.from('boss_spawns_2').update({ 
            end_time: fourHoursLater, 
            last_kill_time: nowIso,
            is_missed: false, 
            missed_count: 0 
        }).eq('id', id);
    };

    window.forceResetTimer = async function(id) {
        const entry = activeEntries.find(e => e.id === id);
        if (!entry) return;
        
        let newEndTime = entry.endTime;
        const now = Date.now();
        
        while (newEndTime <= now) {
            newEndTime += 4 * 60 * 60 * 1000;
        }

        await _supabase.from('boss_spawns_2').update({ 
            end_time: new Date(newEndTime).toISOString(), 
            is_missed: true,
            missed_count: (entry.missedCount || 0) + 1
        }).eq('id', id);
    };

    window.deleteSpawn = async function(id) { 
        await _supabase.from('boss_spawns_2').delete().eq('id', id); 
    };

    function updateChannelHighlights() {
        Object.values(channelButtonMap).forEach(btn => btn.classList.remove('has-spawn'));
        if (!currentSelectedMap || !currentSelectedBoss) return;
        activeEntries.filter(e => e.map === currentSelectedMap && e.boss === currentSelectedBoss)
                     .forEach(e => { if (channelButtonMap[e.channel]) channelButtonMap[e.channel].classList.add('has-spawn'); });
    }

    function formatTimeLeft(ms) {
        const isNegative = ms < 0;
        const absMs = Math.abs(ms);
        let totalSeconds = Math.floor(absMs / 1000);
        let hours = Math.floor(totalSeconds / 3600), minutes = Math.floor((totalSeconds % 3600) / 60), seconds = totalSeconds % 60;
        const timeStr = [hours.toString().padStart(2, '0'), minutes.toString().padStart(2, '0'), seconds.toString().padStart(2, '0')].join(':');
        return isNegative ? `-${timeStr}` : timeStr;
    }

    function formatDateTime(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${day}.${month}.${year}, ${hours}:${minutes}:${seconds}`;
    }

    function rebuildTable() {
        trackerTableBody.innerHTML = '';
        if (activeEntries.length === 0) {
            trackerTableBody.innerHTML = `<tr><td colspan="7" class="empty-table">Keine aktiven Einträge. Wähle Map -> Boss -> Channel aus.</td></tr>`;
            updateChannelHighlights(); return;
        }
        activeEntries.sort((a, b) => a.endTime - b.endTime).forEach(entry => {
            const tr = document.createElement('tr');
            tr.id = `row-${entry.id}`;
            if (entry.isMissed) tr.classList.add('missed-row');

            const lastKillStr = entry.lastKillTime ? formatDateTime(new Date(entry.lastKillTime)) : '-';

            tr.innerHTML = `
                <td>${entry.map}</td>
                <td><span class="boss-name-span">${entry.boss}</span>${entry.isMissed ? '<span class="missed-badge">⚠️ Verpasst</span>' : ''}</td>
                <td>${entry.channel}</td>
                <td><span class="missed-count-badge">${entry.missedCount}</span></td>
                <td class="timestamp-cell">${lastKillStr}</td>
                <td class="timer-cell">--:--:--</td>
                <td class="action-cell">
                    <div class="action-buttons">
                        <button class="kill-btn" onclick="killTimer('${entry.id}')">Kill</button>
                        <button class="force-btn" onclick="forceResetTimer('${entry.id}')">Force</button>
                        <button class="delete-btn" onclick="deleteSpawn('${entry.id}')">🗑️ Löschen</button>
                    </div>
                </td>`;
            trackerTableBody.appendChild(tr);
        });
        updateTableValues();
    }

    function updateTableValues() {
        if (activeEntries.length === 0) return;
        
        activeEntries.forEach(entry => {
            const tr = document.getElementById(`row-${entry.id}`);
            if (!tr) return;
            
            const timeLeftMs = entry.endTime - Date.now();
            
            tr.classList.toggle('missed-row', entry.isMissed);
            
            const cell = tr.querySelector('.timer-cell');
            if (cell) {
                cell.innerText = formatTimeLeft(timeLeftMs);
                cell.className = `timer-cell ${timeLeftMs < 0 ? 'negative' : ''}`;
            }
            
            const forceBtn = tr.querySelector('.force-btn');
            if (forceBtn) forceBtn.disabled = !(timeLeftMs < 0);
        });
        
        updateChannelHighlights();
    }

    fetchSpawns();
    setInterval(updateTableValues, 1000);
    </script>
</body>
</html>
