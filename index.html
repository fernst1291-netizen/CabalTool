<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabal Field Boss Tracker - Porta Inferno</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0d0f12;
            --panel-bg: rgba(22, 27, 34, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            
            --accent-map: #38bdf8;
            --accent-boss: #a855f7;
            --accent-channel: #10b981;
            --accent-kill: #eab308;
            --accent-force: #3b82f6;
            --accent-danger: #ef4444;
            
            --transition-speed: 0.3s;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, #1f293d 0%, var(--bg-color) 70%);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h2, h3 { text-align: center; font-weight: 600; letter-spacing: 1px; color: var(--text-primary); text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        .button-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

        button { border: 1px solid var(--border-color); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 500; transition: all var(--transition-speed) cubic-bezier(0.4, 0, 0.2, 1); backdrop-filter: blur(10px); outline: none; }

        .wrapper { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); max-height: 0; opacity: 0; overflow: hidden; margin-top: 0; padding-top: 0; padding-bottom: 0; border-width: 0; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .wrapper.visible { max-height: 500px; opacity: 1; padding: 20px; border-width: 1px; margin-top: 10px; }

        .boss-btn { background-color: rgba(45, 27, 105, 0.4); color: #e9d5ff; border-color: rgba(168, 85, 247, 0.2); }
        .boss-btn:hover { background-color: rgba(168, 85, 247, 0.2); border-color: var(--accent-boss); color: #ffffff; transform: translateY(-2px); }
        .boss-btn.active { background-color: var(--accent-boss); color: #ffffff; border-color: var(--accent-boss); box-shadow: 0 0 15px rgba(168, 85, 247, 0.5); }

        .channel-btn { background-color: rgba(6, 78, 59, 0.4); color: #d1fae5; border-color: rgba(16, 185, 129, 0.2); padding: 8px 14px; font-size: 13px; position: relative; }
        .channel-btn:hover { background-color: var(--accent-channel); color: #022c22; border-color: var(--accent-channel); box-shadow: 0 0 10px rgba(16, 185, 129, 0.4); transform: translateY(-1px); }
        .channel-btn.active { background-color: var(--accent-channel); color: #022c22; border-color: var(--accent-channel); box-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
        .channel-btn.has-spawn { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }
        .channel-btn.has-spawn::after { content: ''; position: absolute; top: -4px; right: -4px; width: 8px; height: 8px; background-color: #38bdf8; border-radius: 50%; box-shadow: 0 0 6px #38bdf8; }

        .table-section { margin-top: 30px; background: var(--panel-bg); border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; backdrop-filter: blur(12px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
        .table-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .table-header-row h3 { margin: 0; text-align: left; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { color: var(--text-secondary); font-weight: 600; background-color: rgba(255, 255, 255, 0.02); }
        tr:hover td { background-color: rgba(255, 255, 255, 0.02); }
        tr.missed-row td { background-color: rgba(239, 68, 68, 0.05); }
        .missed-badge { background-color: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); padding: 2px 6px; font-size: 11px; border-radius: 4px; margin-left: 8px; font-weight: 600; display: inline-block; }
        .timer-cell { font-family: monospace; font-size: 15px; font-weight: 600; color: #38bdf8; }
        .timer-cell.negative { color: var(--accent-danger); }
        
        .kill-btn, .force-btn, .delete-btn { padding: 5px 10px; font-size: 12px; border-radius: 6px; margin-right: 4px; margin-bottom: 4px; }
        .kill-btn { background-color: rgba(234, 179, 8, 0.2); color: #fef08a; border: 1px solid rgba(234, 179, 8, 0.4); }
        .kill-btn:hover { background-color: var(--accent-kill); color: #713f12; }
        .force-btn { background-color: rgba(59, 130, 246, 0.2); color: #bfdbfe; border: 1px solid rgba(59, 130, 246, 0.4); }
        .force-btn:hover:not(:disabled) { background-color: var(--accent-force); color: #ffffff; }
        .force-btn:disabled { background-color: rgba(255, 255, 255, 0.03); color: var(--text-secondary); cursor: not-allowed; opacity: 0.5; }
        .delete-btn { background-color: rgba(239, 68, 68, 0.2); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }
        .delete-btn:hover { background-color: var(--accent-danger); color: #ffffff; }
        .empty-table { text-align: center; color: var(--text-secondary); padding: 20px; font-style: italic; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cabal Boss Tracker - Porta Inferno</h2>
        
        <!-- Boss Auswahl (Direkt sichtbar für Porta Inferno) -->
        <div id="bossWrapper" class="wrapper visible">
            <div id="bossContainer" class="button-row"></div>
            <div id="channelWrapper" class="wrapper">
                <div id="channelContainer" class="button-row"></div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header-row"><h3>Active Spawns Tracker</h3></div>
            <table>
                <thead>
                    <tr><th>Map</th><th>Boss</th><th>Channel</th><th>Spawntimer</th><th>Action</th></tr>
                </thead>
                <tbody id="trackerTableBody">
                    <tr><td colspan="5" class="empty-table">No active records. Select a boss -> Channel.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
	const SUPABASE_URL = 'https://wugidpaftcwitbabyeir.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1Z2lkcGFmdGN3aXRiYWJ5ZWlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDU4NjcsImV4cCI6MjEwMjYyMTg2N30.nAEH3PcMyKAeXV5oaJ1vm3pI4wib2YXuy0MAiOPV0NE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Nur noch Porta Inferno als feste Map hinterlegt[cite: 1]
    const cabalData = {
        "Porta Inferno": [
            { name: "Manticore" }, 
            { name: "Dark Kimzark" }, 
            { name: "Keshapone Minisha" }
        ]
    };

    const bossWrapper = document.getElementById('bossWrapper');
    const bossContainer = document.getElementById('bossContainer');
    const channelWrapper = document.getElementById('channelWrapper');
    const channelContainer = document.getElementById('channelContainer');
    const trackerTableBody = document.getElementById('trackerTableBody');

    let activeBossButton = null, activeChannelButton = null;
    let currentSelectedMap = "Porta Inferno"; // Direkt fest auf Porta Inferno gesetzt
    let currentSelectedBoss = null;
    let activeEntries = [];
    const channelButtonMap = {};
    const pendingUpdates = new Set();

    async function fetchSpawns() {
        const { data, error } = await _supabase.from('boss_spawns_limited').select('*');
        if (!error && data) {
            activeEntries = data.map(item => ({
                id: item.id, map: item.map, boss: item.boss, channel: item.channel,
                endTime: new Date(item.end_time).getTime(), isMissed: item.is_missed
            }));
            rebuildTable();
        }
    }

    _supabase.channel('public:boss_spawns_limited').on('postgres_changes', { event: '*', schema: 'public', table: 'boss_spawns_limited' }, () => { fetchSpawns(); }).subscribe();

    // 15 Channels generieren
    for (let i = 1; i <= 15; i++) {
        const chBtn = document.createElement('button');
        chBtn.className = 'channel-btn';
        chBtn.innerText = `Ch. ${i}`;
        const channelName = `Channel ${i}`;
        chBtn.dataset.channel = channelName;
        channelButtonMap[channelName] = chBtn;
        chBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (activeChannelButton) activeChannelButton.classList.remove('active');
            chBtn.classList.add('active');
            activeChannelButton = chBtn;
            const fourHoursLater = new Date(Date.now() + (4 * 60 * 60 * 1000)).toISOString();
            await _supabase.from('boss_spawns_limited').upsert({ map: currentSelectedMap, boss: currentSelectedBoss, channel: channelName, end_time: fourHoursLater, is_missed: false }, { onConflict: 'map,boss,channel' });
        });
        channelContainer.appendChild(chBtn);
    }

    // Direkt beim Laden die Bosse für Porta Inferno rendern
    cabalData["Porta Inferno"].forEach(boss => {
        const bossBtn = document.createElement('button');
        bossBtn.className = 'boss-btn';
        bossBtn.innerText = boss.name;
        bossBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (activeBossButton) activeBossButton.classList.remove('active');
            bossBtn.classList.add('active'); 
            activeBossButton = bossBtn; 
            currentSelectedBoss = boss.name;
            channelWrapper.classList.add('visible'); 
            updateChannelHighlights();
        });
        bossContainer.appendChild(bossBtn);
    });

    window.killTimer = async function(id) {
        const fourHoursLater = new Date(Date.now() + (4 * 60 * 60 * 1000)).toISOString();
        await _supabase.from('boss_spawns_limited').update({ end_time: fourHoursLater, is_missed: false }).eq('id', id);
    };

    window.forceResetTimer = async function(id) {
        const entry = activeEntries.find(e => e.id === id);
        if (!entry) return;
        
        let newEndTime = entry.endTime;
        const now = Date.now();
        
        while (newEndTime <= now) {
            newEndTime += 4 * 60 * 60 * 1000;
        }

        await _supabase.from('boss_spawns_limited').update({ 
            end_time: new Date(newEndTime).toISOString(), 
            is_missed: true 
        }).eq('id', id);
    };

    window.deleteSpawn = async function(id) { await _supabase.from('boss_spawns_limited').delete().eq('id', id); };

    function updateChannelHighlights() {
        Object.values(channelButtonMap).forEach(btn => btn.classList.remove('has-spawn'));
        if (!currentSelectedBoss) return;
        activeEntries.filter(e => e.map === currentSelectedMap && e.boss === currentSelectedBoss)
                     .forEach(e => { if (channelButtonMap[e.channel]) channelButtonMap[e.channel].classList.add('has-spawn'); });
    }

    function formatTimeLeft(ms) {
        const isNegative = ms < 0;
        const absMs = Math.abs(ms);
        let totalSeconds = Math.floor(absMs / 1000);
        let hours = Math.floor(totalSeconds / 3600), minutes = Math.floor((totalSeconds % 3600) / 60), seconds = totalSeconds % 60;
        const timeStr = [hours.toString().padStart(2, '0'), minutes.toString().padStart(2, '0'), seconds.toString().padStart(2, '0')].join(':');
        return isNegative ? `-${timeStr}` : timeStr;
    }

    function rebuildTable() {
        trackerTableBody.innerHTML = '';
        if (activeEntries.length === 0) {
            trackerTableBody.innerHTML = `<tr><td colspan="5" class="empty-table">No active records. Select a boss -> Channel.</td></tr>`;
            updateChannelHighlights(); return;
        }
        activeEntries.sort((a, b) => a.endTime - b.endTime).forEach(entry => {
            const tr = document.createElement('tr');
            tr.id = `row-${entry.id}`;
            if (entry.isMissed) tr.classList.add('missed-row');
            tr.innerHTML = `
                <td>${entry.map}</td>
                <td><span class="boss-name-span">${entry.boss}</span>${entry.isMissed ? '<span class="missed-badge">⚠️ Missed</span>' : ''}</td>
                <td>${entry.channel}</td>
                <td class="timer-cell">--:--:--</td>
                <td>
                    <button class="kill-btn" onclick="killTimer('${entry.id}')">Kill</button>
                    <button class="force-btn" onclick="forceResetTimer('${entry.id}')">Force</button>
                    <button class="delete-btn" onclick="deleteSpawn('${entry.id}')">🗑️ Delete</button>
                </td>`;
            trackerTableBody.appendChild(tr);
        });
        updateTableValues();
    }

    function updateTableValues() {
        if (activeEntries.length === 0) return;
        
        activeEntries.forEach(entry => {
            const tr = document.getElementById(`row-${entry.id}`);
            if (!tr) return;
            const timeLeftMs = entry.endTime - Date.now();
            
            if (timeLeftMs <= -10 * 60 * 1000 && !pendingUpdates.has(entry.id)) {
                pendingUpdates.add(entry.id);
                
                let newEndTime = entry.endTime;
                const now = Date.now();
                while (newEndTime <= now) {
                    newEndTime += 4 * 60 * 60 * 1000;
                }

                _supabase.from('boss_spawns_limited')
                    .update({ 
                        end_time: new Date(newEndTime).toISOString(), 
                        is_missed: true 
                    })
                    .eq('id', entry.id)
                    .then(() => pendingUpdates.delete(entry.id))
                    .catch(() => pendingUpdates.delete(entry.id));
            }

            tr.classList.toggle('missed-row', entry.isMissed);
            const cell = tr.querySelector('.timer-cell');
            cell.innerText = formatTimeLeft(timeLeftMs);
            cell.className = `timer-cell ${timeLeftMs < 0 ? 'negative' : ''}`;
            const forceBtn = tr.querySelector('.force-btn');
            if (forceBtn) forceBtn.disabled = !(timeLeftMs < 0);
        });
        updateChannelHighlights();
    }

    fetchSpawns();
    setInterval(updateTableValues, 1000);
    </script>
</body>
</html>
