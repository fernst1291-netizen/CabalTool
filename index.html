<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabal Field Boss Tracker 1.1</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --panel-bg: rgba(15, 23, 42, 0.65);
            --panel-border: rgba(255, 255, 255, 0.06);
            --panel-border-hover: rgba(56, 189, 248, 0.3);
            
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            
            --accent-map: #38bdf8;
            --accent-boss: #c084fc;
            --accent-channel: #34d399;
            --accent-kill: #fbbf24;
            --accent-force: #60a5fa;
            --accent-danger: #f87171;
            
            --transition-smooth: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(192, 132, 252, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, #0d1424 0%, var(--bg-color) 100%);
            color: var(--text-primary);
            margin: 0;
            padding: 40px 20px;
            min-height: 100vh;
        }

        h2, h3 { 
            text-align: center; 
            font-weight: 600; 
            letter-spacing: 0.5px; 
            color: var(--text-primary); 
        }

        h2 {
            font-size: 1.8rem;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
        }

        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
        }

        .button-row { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 10px; 
            justify-content: center; 
            align-items: center;
        }

        /* Einheitliche Button-Höhen und augenschonendes Design */
        button { 
            background: rgba(30, 41, 59, 0.4);
            border: 1px solid var(--panel-border);
            padding: 10px 18px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-size: 13.5px; 
            font-weight: 500; 
            font-family: 'Outfit', sans-serif;
            color: var(--text-secondary);
            transition: var(--transition-smooth); 
            backdrop-filter: blur(12px);
            outline: none; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 42px; /* Garantiert exakt gleiche Höhe */
        }

        .map-btn:hover { 
            background: rgba(56, 189, 248, 0.1); 
            border-color: var(--panel-border-hover); 
            color: var(--accent-map); 
            transform: translateY(-2px); 
        }
        .map-btn.active { 
            background: linear-gradient(135deg, #0284c7, #38bdf8); 
            color: #ffffff; 
            border-color: #7dd3fc; 
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
            font-weight: 600;
        }

        .wrapper { 
            background: var(--panel-bg); 
            border: 1px solid var(--panel-border); 
            padding: 0; 
            border-radius: 14px; 
            backdrop-filter: blur(16px); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            max-height: 0; 
            opacity: 0; 
            overflow: hidden; 
            margin-top: 0; 
            border-width: 0; 
            transition: var(--transition-smooth); 
        }
        .wrapper.visible { 
            max-height: 500px; 
            opacity: 1; 
            padding: 20px; 
            border-width: 1px; 
            border-color: var(--panel-border);
            margin-top: 6px; 
        }

        .boss-btn { 
            background: rgba(45, 27, 105, 0.3); 
            color: #e9d5ff; 
            border-color: rgba(192, 132, 252, 0.15); 
        }
        .boss-btn:hover { 
            background: rgba(192, 132, 252, 0.15); 
            border-color: rgba(192, 132, 252, 0.4); 
            color: #ffffff; 
            transform: translateY(-2px); 
        }
        .boss-btn.active { 
            background: linear-gradient(135deg, #7e22ce, #c084fc); 
            color: #ffffff; 
            border-color: #d8b4fe; 
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.4);
            font-weight: 600;
        }

        .channel-btn { 
            background: rgba(6, 78, 59, 0.3); 
            color: #a7f3d0; 
            border-color: rgba(52, 211, 153, 0.15); 
            padding: 8px 14px; 
            font-size: 13px; 
            height: 38px; /* Kanäle etwas kompakter */
            position: relative; 
        }
        .channel-btn:hover { 
            background: rgba(52, 211, 153, 0.2); 
            border-color: rgba(52, 211, 153, 0.4); 
            color: #ffffff; 
            transform: translateY(-1px); 
        }
        .channel-btn.active { 
            background: linear-gradient(135deg, #059669, #34d399); 
            color: #ffffff; 
            border-color: #6ee7b7; 
            box-shadow: 0 0 20px rgba(52, 211, 153, 0.4);
            font-weight: 600;
        }
        .channel-btn.has-spawn { 
            border-color: var(--accent-map); 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25); 
        }
        .channel-btn.has-spawn::after { 
            content: ''; 
            position: absolute; 
            top: -3px; 
            right: -3px; 
            width: 7px; 
            height: 7px; 
            background-color: var(--accent-map); 
            border-radius: 50%; 
            box-shadow: 0 0 6px var(--accent-map); 
        }

        .table-section { 
            margin-top: 20px; 
            background: var(--panel-bg); 
            border: 1px solid var(--panel-border); 
            padding: 22px; 
            border-radius: 14px; 
            backdrop-filter: blur(16px); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); 
            overflow-x: auto; 
        }
        .table-header-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 16px; 
            padding-bottom: 10px;
            border-bottom: 1px solid var(--panel-border);
        }
        .table-header-row h3 { 
            margin: 0; 
            text-align: left; 
            font-size: 1.1rem;
            color: var(--text-primary);
        }

        table { 
            width: 100%; 
            border-collapse: separate; 
            border-spacing: 0; 
            text-align: left; 
        }
        th, td { 
            padding: 14px 16px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.03); 
            font-size: 13.5px; 
            white-space: nowrap; 
        }
        th { 
            color: var(--text-secondary); 
            font-weight: 600; 
            background-color: rgba(255, 255, 255, 0.015); 
            text-transform: uppercase;
            font-size: 11.5px;
            letter-spacing: 0.8px;
            border-bottom: 1px solid var(--panel-border);
        }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: rgba(255, 255, 255, 0.025); }
        
        tr.missed-row td { background-color: rgba(248, 113, 113, 0.04); }
        tr.missed-row:hover td { background-color: rgba(248, 113, 113, 0.08); }

        .missed-badge { 
            background-color: rgba(248, 113, 113, 0.15); 
            color: #fca5a5; 
            border: 1px solid rgba(248, 113, 113, 0.3); 
            padding: 3px 8px; 
            font-size: 11px; 
            border-radius: 6px; 
            margin-left: 8px; 
            font-weight: 600; 
            display: inline-block; 
        }
        .missed-count-badge { 
            font-family: 'JetBrains Mono', monospace; 
            background: rgba(255, 255, 255, 0.04); 
            padding: 4px 10px; 
            border-radius: 6px; 
            border: 1px solid var(--panel-border); 
            font-weight: 600; 
            font-size: 12px;
            color: #cbd5e1;
        }
        .timestamp-cell { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 12.5px; 
            color: var(--text-secondary); 
        }
        .timer-cell { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 14.5px; 
            font-weight: 600; 
            color: var(--accent-map); 
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }
        .timer-cell.negative { 
            color: var(--accent-danger); 
            text-shadow: 0 0 12px rgba(248, 113, 113, 0.3);
        }
        
        .action-buttons { display: flex; gap: 8px; align-items: center; }
        
        /* Einheitliche Aktionstasten mit sanftem Hover */
        .kill-btn, .force-btn, .delete-btn { 
            padding: 6px 14px; 
            font-size: 12.5px; 
            border-radius: 6px; 
            margin: 0; 
            height: auto;
            font-weight: 600;
        }
        
        .kill-btn { 
            background-color: rgba(251, 191, 36, 0.12); 
            color: #fde047; 
            border: 1px solid rgba(251, 191, 36, 0.25); 
        }
        .kill-btn:hover { 
            background-color: var(--accent-kill); 
            color: #451a03; 
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.3);
        }
        
        .force-btn { 
            background-color: rgba(96, 165, 250, 0.12); 
            color: #93c5fd; 
            border: 1px solid rgba(96, 165, 250, 0.25); 
        }
        .force-btn:hover:not(:disabled) { 
            background-color: var(--accent-force); 
            color: #ffffff; 
            box-shadow: 0 0 12px rgba(96, 165, 250, 0.3);
        }
        .force-btn:disabled { 
            background-color: rgba(255, 255, 255, 0.02); 
            color: #475569; 
            border-color: rgba(255, 255, 255, 0.02); 
            cursor: not-allowed; 
            opacity: 0.5; 
        }
        
        .delete-btn { 
            background-color: rgba(248, 113, 113, 0.12); 
            color: #fca5a5; 
            border: 1px solid rgba(248, 113, 113, 0.25); 
        }
        .delete-btn:hover { 
            background-color: var(--accent-danger); 
            color: #ffffff; 
            box-shadow: 0 0 12px rgba(248, 113, 113, 0.3);
        }
        
        .empty-table { 
            text-align: center; 
            color: var(--text-secondary); 
            padding: 30px; 
            font-style: italic; 
            white-space: normal; 
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(8, 12, 20, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cabal Field Boss Tracker 1.1</h2>
        <div id="mapContainer" class="button-row"></div>
        <div id="bossWrapper" class="wrapper">
            <div id="bossContainer" class="button-row"></div>
            <div id="channelWrapper" class="wrapper">
                <div id="channelContainer" class="button-row"></div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header-row"><h3>Active Spawn Tracker</h3></div>
            <table>
                <thead>
                    <tr><th>Map</th><th>Boss</th><th>Channel</th><th>Missed Count</th><th>Last Kill</th><th>Spawn Timer</th><th>Action</th></tr>
                </thead>
                <tbody id="trackerTableBody">
                    <tr><td colspan="7" class="empty-table">No active entries. Select Map -> Boss -> Channel.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    const SUPABASE_URL = 'https://wugidpaftcwitbabyeir.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1Z2lkcGFmdGN3aXRiYWJ5ZWlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDU4NjcsImV4cCI6MjEwMjYyMTg2N30.nAEH3PcMyKAeXV5oaJ1vm3pI4wib2YXuy0MAiOPV0NE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Restricted to Porta Inferno[cite: 6]
    const cabalData = {
        "Porta Inferno": [{ name: "Manticore" }, { name: "Dark Kimzark" }, { name: "Keshapone Minisha" }]
    };

    const mapContainer = document.getElementById('mapContainer');
    const bossWrapper = document.getElementById('bossWrapper');
    const bossContainer = document.getElementById('bossContainer');
    const channelWrapper = document.getElementById('channelWrapper');
    const channelContainer = document.getElementById('channelContainer');
    const trackerTableBody = document.getElementById('trackerTableBody');

    let activeMapButton = null, activeBossButton = null, activeChannelButton = null;
    let currentSelectedMap = null, currentSelectedBoss = null;
    let activeEntries = [];
    const channelButtonMap = {};

    async function fetchSpawns() {
        console.log("Loading data from Supabase...");
        const { data, error } = await _supabase.from('boss_spawns_limited').select('*').range(0, 999);
        
        if (error) {
            console.error("Supabase Error:", error);
            return;
        }

        if (data) {
            activeEntries = data.map(item => ({
                id: item.id, 
                map: item.map, 
                boss: item.boss, 
                channel: item.channel,
                endTime: item.end_time ? new Date(item.end_time).getTime() : 0, 
                lastKillTime: item.last_kill_time ? new Date(item.last_kill_time).getTime() : 0,
                isMissed: item.is_missed || false,
                missedCount: item.missed_count || 0
            }));
            rebuildTable();
        }
    }

    _supabase.channel('public:boss_spawns_limited').on('postgres_changes', { event: '*', schema: 'public', table: 'boss_spawns_limited' }, () => { fetchSpawns(); }).subscribe();

    for (let i = 1; i <= 15; i++) {
        const chBtn = document.createElement('button');
        chBtn.className = 'channel-btn';
        chBtn.innerText = `Ch. ${i}`;
        const channelName = `Channel ${i}`;
        chBtn.dataset.channel = channelName;
        channelButtonMap[channelName] = chBtn;
        chBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (activeChannelButton) activeChannelButton.classList.remove('active');
            chBtn.classList.add('active');
            activeChannelButton = chBtn;
            const nowIso = new Date().toISOString();
            const fourHoursLater = new Date(Date.now() + (4 * 60 * 60 * 1000)).toISOString();
            await _supabase.from('boss_spawns_limited').upsert({ 
                map: currentSelectedMap, boss: currentSelectedBoss, channel: channelName, 
                end_time: fourHoursLater, last_kill_time: nowIso, is_missed: false, missed_count: 0 
            }, { onConflict: 'map,boss,channel' });
        });
        channelContainer.appendChild(chBtn);
    }

    Object.keys(cabalData).forEach(mapName => {
        const mapBtn = document.createElement('button');
        mapBtn.className = 'map-btn';
        mapBtn.innerText = mapName;
        mapBtn.addEventListener('click', () => {
            if (activeMapButton === mapBtn) {
                bossWrapper.classList.remove('visible'); channelWrapper.classList.remove('visible'); mapBtn.classList.remove('active');
                activeMapButton = null; activeBossButton = null; activeChannelButton = null;
                currentSelectedMap = null; currentSelectedBoss = null; updateChannelHighlights(); return;
            }
            if (activeMapButton) activeMapButton.classList.remove('active');
            mapBtn.classList.add('active'); activeMapButton = mapBtn; currentSelectedMap = mapName;
            bossContainer.innerHTML = '';
            cabalData[mapName].forEach(boss => {
                const bossBtn = document.createElement('button');
                bossBtn.className = 'boss-btn';
                bossBtn.innerText = boss.name;
                bossBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (activeBossButton) activeBossButton.classList.remove('active');
                    bossBtn.classList.add('active'); activeBossButton = bossBtn; currentSelectedBoss = boss.name;
                    channelWrapper.classList.add('visible'); updateChannelHighlights();
                });
                bossContainer.appendChild(bossBtn);
            });
            bossWrapper.classList.add('visible');
        });
        mapContainer.appendChild(mapBtn);
    });

    window.killTimer = async function(id) {
        const nowIso = new Date().toISOString();
        const fourHoursLater = new Date(Date.now() + (4 * 60 * 60 * 1000)).toISOString();
        await _supabase.from('boss_spawns_limited').update({ 
            end_time: fourHoursLater, 
            last_kill_time: nowIso,
            is_missed: false, 
            missed_count: 0 
        }).eq('id', id);
    };

    window.forceResetTimer = async function(id) {
        const entry = activeEntries.find(e => e.id === id);
        if (!entry) return;
        
        let newEndTime = entry.endTime;
        const now = Date.now();
        
        while (newEndTime <= now) {
            newEndTime += 4 * 60 * 60 * 1000;
        }

        await _supabase.from('boss_spawns_limited').update({ 
            end_time: new Date(newEndTime).toISOString(), 
            is_missed: true,
            missed_count: (entry.missedCount || 0) + 1
        }).eq('id', id);
    };

    window.deleteSpawn = async function(id) { 
        await _supabase.from('boss_spawns_limited').delete().eq('id', id); 
    };

    function updateChannelHighlights() {
        Object.values(channelButtonMap).forEach(btn => btn.classList.remove('has-spawn'));
        if (!currentSelectedMap || !currentSelectedBoss) return;
        activeEntries.filter(e => e.map === currentSelectedMap && e.boss === currentSelectedBoss)
                     .forEach(e => { if (channelButtonMap[e.channel]) channelButtonMap[e.channel].classList.add('has-spawn'); });
    }

    function formatTimeLeft(ms) {
        const isNegative = ms < 0;
        const absMs = Math.abs(ms);
        let totalSeconds = Math.floor(absMs / 1000);
        let hours = Math.floor(totalSeconds / 3600), minutes = Math.floor((totalSeconds % 3600) / 60), seconds = totalSeconds % 60;
        const timeStr = [hours.toString().padStart(2, '0'), minutes.toString().padStart(2, '0'), seconds.toString().padStart(2, '0')].join(':');
        return isNegative ? `-${timeStr}` : timeStr;
    }

    function formatDateTime(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${day}.${month}.${year}, ${hours}:${minutes}:${seconds}`;
    }

    function rebuildTable() {
        trackerTableBody.innerHTML = '';
        if (activeEntries.length === 0) {
            trackerTableBody.innerHTML = `<tr><td colspan="7" class="empty-table">No active entries. Select Map -> Boss -> Channel.</td></tr>`;
            updateChannelHighlights(); return;
        }
        activeEntries.sort((a, b) => a.endTime - b.endTime).forEach(entry => {
            const tr = document.createElement('tr');
            tr.id = `row-${entry.id}`;
            if (entry.isMissed) tr.classList.add('missed-row');

            const lastKillStr = entry.lastKillTime ? formatDateTime(new Date(entry.lastKillTime)) : '-';

            tr.innerHTML = `
                <td>${entry.map}</td>
                <td><span class="boss-name-span">${entry.boss}</span>${entry.isMissed ? '<span class="missed-badge">⚠️ Missed</span>' : ''}</td>
                <td>${entry.channel}</td>
                <td><span class="missed-count-badge">${entry.missedCount}</span></td>
                <td class="timestamp-cell">${lastKillStr}</td>
                <td class="timer-cell">--:--:--</td>
                <td>
                    <div class="action-buttons">
                        <button class="kill-btn" onclick="killTimer('${entry.id}')">Kill</button>
                        <button class="force-btn" onclick="forceResetTimer('${entry.id}')">Force Miss</button>
                        <button class="delete-btn" onclick="deleteSpawn('${entry.id}')">🗑️ Delete</button>
                    </div>
                </td>`;
            trackerTableBody.appendChild(tr);
        });
        updateTableValues();
    }

    function updateTableValues() {
        if (activeEntries.length === 0) return;
        
        activeEntries.forEach(entry => {
            const tr = document.getElementById(`row-${entry.id}`);
            if (!tr) return;
            
            const timeLeftMs = entry.endTime - Date.now();
            
            tr.classList.toggle('missed-row', entry.isMissed);
            
            const cell = tr.querySelector('.timer-cell');
            if (cell) {
                cell.innerText = formatTimeLeft(timeLeftMs);
                cell.className = `timer-cell ${timeLeftMs < 0 ? 'negative' : ''}`;
            }
            
            const forceBtn = tr.querySelector('.force-btn');
            if (forceBtn) forceBtn.disabled = !(timeLeftMs < 0);
        });
        
        updateChannelHighlights();
    }

    fetchSpawns();
    setInterval(updateTableValues, 1000);
    </script>
</body>
</html>
