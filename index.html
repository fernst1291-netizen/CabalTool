<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cabal Field Boss Tracker 1.0</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #008080; /* Win95 Teal Desktop Background */
            --panel-bg: #c0c0c0; /* Win95 Classic Grey */
            --border-light: #ffffff;
            --border-dark: #808080;
            --border-darker: #404040;
            --text-primary: #000000;
            --text-secondary: #404040;
            
            --accent-map: #000080;
            --accent-boss: #550055;
            --accent-channel: #006600;
            --accent-kill: #c0c000;
            --accent-force: #0000aa;
            --accent-danger: #aa0000;
        }

        body {
            font-family: 'MS Sans Serif', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h2, h3 { 
            text-align: center; 
            font-weight: bold; 
            letter-spacing: 0.5px; 
            color: #ffffff; 
            text-shadow: 2px 2px #000000; 
            font-family: 'MS Sans Serif', Arial, sans-serif;
        }

        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }

        .button-row { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 6px; 
            justify-content: center; 
        }

        /* 90s Retro 3D Buttons */
        button { 
            background-color: #c0c0c0;
            border-top: 2px solid var(--border-light);
            border-left: 2px solid var(--border-light);
            border-right: 2px solid var(--border-darker);
            border-bottom: 2px solid var(--border-darker);
            padding: 8px 14px; 
            border-radius: 0; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: bold; 
            font-family: 'MS Sans Serif', Arial, sans-serif;
            color: #000000;
            outline: none;
            transition: none; 
        }

        button:active {
            border-top: 2px solid var(--border-darker);
            border-left: 2px solid var(--border-darker);
            border-right: 2px solid var(--border-light);
            border-bottom: 2px solid var(--border-light);
            padding: 9px 13px 7px 15px;
        }

        .map-btn { background-color: #c0c0c0; color: #000000; }
        .map-btn:hover { background-color: #d4d4d4; }
        .map-btn.active { 
            background-color: #000080; 
            color: #ffffff; 
            border-top: 2px solid var(--border-darker);
            border-left: 2px solid var(--border-darker);
            border-right: 2px solid var(--border-light);
            border-bottom: 2px solid var(--border-light);
        }

        .wrapper { 
            background: #c0c0c0; 
            border-top: 2px solid var(--border-light);
            border-left: 2px solid var(--border-light);
            border-right: 2px solid var(--border-darker);
            border-bottom: 2px solid var(--border-darker);
            padding: 0; 
            border-radius: 0; 
            max-height: 0; 
            opacity: 0; 
            overflow: hidden; 
            margin-top: 0; 
            border-width: 0; 
            transition: max-height 0.3s ease, opacity 0.3s ease; 
        }
        .wrapper.visible { 
            max-height: 500px; 
            opacity: 1; 
            padding: 15px; 
            border-top: 2px solid var(--border-light);
            border-left: 2px solid var(--border-light);
            border-right: 2px solid var(--border-darker);
            border-bottom: 2px solid var(--border-darker);
            margin-top: 10px; 
        }

        .boss-btn { background-color: #c0c0c0; color: #000000; }
        .boss-btn:hover { background-color: #d4d4d4; }
        .boss-btn.active { 
            background-color: #550055; 
            color: #ffffff; 
            border-top: 2px solid var(--border-darker);
            border-left: 2px solid var(--border-darker);
            border-right: 2px solid var(--border-light);
            border-bottom: 2px solid var(--border-light);
        }

        .channel-btn { background-color: #c0c0c0; color: #000000; padding: 6px 10px; font-size: 12px; position: relative; }
        .channel-btn:hover { background-color: #d4d4d4; }
        .channel-btn.active { 
            background-color: #006600; 
            color: #ffffff; 
            border-top: 2px solid var(--border-darker);
            border-left: 2px solid var(--border-darker);
            border-right: 2px solid var(--border-light);
            border-bottom: 2px solid var(--border-light);
        }
        .channel-btn.has-spawn { border-color: #0000ff; }
        .channel-btn.has-spawn::after { content: ''; position: absolute; top: 2px; right: 2px; width: 5px; height: 5px; background-color: #ff0000; border-radius: 0; }

        .table-section { 
            margin-top: 20px; 
            background: #c0c0c0; 
            border-top: 2px solid var(--border-light);
            border-left: 2px solid var(--border-light);
            border-right: 2px solid var(--border-darker);
            border-bottom: 2px solid var(--border-darker);
            padding: 15px; 
            border-radius: 0; 
            overflow-x: auto; 
        }
        .table-header-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            border-bottom: 1px solid var(--border-dark);
            padding-bottom: 5px;
        }
        .table-header-row h3 { 
            margin: 0; 
            text-align: left; 
            color: #000000;
            text-shadow: none;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            text-align: left; 
            background-color: #ffffff;
            border: 2px inset #dfdfdf;
        }
        th, td { 
            padding: 8px 10px; 
            border: 1px solid #808080; 
            font-size: 13px; 
            white-space: nowrap; 
            color: #000000;
        }
        th { 
            color: #000000; 
            font-weight: bold; 
            background-color: #c0c0c0; 
            border-top: 1px solid var(--border-light);
            border-left: 1px solid var(--border-light);
            border-right: 1px solid var(--border-darker);
            border-bottom: 2px solid var(--border-darker);
        }
        tr:hover td { background-color: #000080; color: #ffffff; }
        tr:hover .timestamp-cell, tr:hover .timer-cell { color: #ffffff; }
        
        tr.missed-row td { background-color: #ffcccc; color: #000000; }
        tr.missed-row:hover td { background-color: #aa0000; color: #ffffff; }

        .missed-badge { 
            background-color: #ff0000; 
            color: #ffffff; 
            border: 1px solid #000000; 
            padding: 1px 4px; 
            font-size: 10px; 
            border-radius: 0; 
            margin-left: 6px; 
            font-weight: bold; 
            display: inline-block; 
        }
        .missed-count-badge { 
            font-family: 'Courier New', monospace; 
            background: #e0e0e0; 
            padding: 2px 6px; 
            border: 1px solid #808080; 
            font-weight: bold; 
        }
        .timestamp-cell { 
            font-family: 'Courier New', monospace; 
            font-size: 12px; 
            color: #333333; 
        }
        .timer-cell { 
            font-family: 'Courier New', monospace; 
            font-size: 14px; 
            font-weight: bold; 
            color: #0000aa; 
        }
        .timer-cell.negative { color: #ff0000; }
        
        .action-buttons { display: flex; gap: 4px; align-items: center; }
        .kill-btn, .force-btn, .delete-btn { padding: 3px 8px; font-size: 11px; border-radius: 0; margin: 0; font-family: 'MS Sans Serif', Arial, sans-serif; }
        
        .kill-btn { background-color: #e0e000; color: #000000; }
        .kill-btn:hover { background-color: #ffff00; }
        
        .force-btn { background-color: #c0c0c0; color: #000000; }
        .force-btn:hover:not(:disabled) { background-color: #0000ff; color: #ffffff; }
        .force-btn:disabled { background-color: #e0e0e0; color: #808080; cursor: not-allowed; border-color: #a0a0a0; }
        
        .delete-btn { background-color: #ff9999; color: #000000; }
        .delete-btn:hover { background-color: #ff0000; color: #ffffff; }
        
        .empty-table { text-align: center; color: #666666; padding: 15px; font-style: italic; white-space: normal; background-color: #ffffff; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Cabal Field Boss Tracker 1.0</h2>
        <div id="mapContainer" class="button-row"></div>
        <div id="bossWrapper" class="wrapper">
            <div id="bossContainer" class="button-row"></div>
            <div id="channelWrapper" class="wrapper">
                <div id="channelContainer" class="button-row"></div>
            </div>
        </div>

        <div class="table-section">
            <div class="table-header-row"><h3>Active Spawn Tracker</h3></div>
            <table>
                <thead>
                    <tr><th>Map</th><th>Boss</th><th>Channel</th><th>Missed Count</th><th>Last Kill</th><th>Spawn Timer</th><th>Action</th></tr>
                </thead>
                <tbody id="trackerTableBody">
                    <tr><td colspan="7" class="empty-table">No active entries. Select Map -> Boss -> Channel.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
    const SUPABASE_URL = 'https://wugidpaftcwitbabyeir.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind1Z2lkcGFmdGN3aXRiYWJ5ZWlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNDU4NjcsImV4cCI6MjEwMjYyMTg2N30.nAEH3PcMyKAeXV5oaJ1vm3pI4wib2YXuy0MAiOPV0NE';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Restricted to Porta Inferno[cite: 6]
    const cabalData = {
        "Porta Inferno": [{ name: "Manticore" }, { name: "Dark Kimzark" }, { name: "Keshapone Minisha" }]
    };

    const mapContainer = document.getElementById('mapContainer');
    const bossWrapper = document.getElementById('bossWrapper');
    const bossContainer = document.getElementById('bossContainer');
    const channelWrapper = document.getElementById('channelWrapper');
    const channelContainer = document.getElementById('channelContainer');
    const trackerTableBody = document.getElementById('trackerTableBody');

    let activeMapButton = null, activeBossButton = null, activeChannelButton = null;
    let currentSelectedMap = null, currentSelectedBoss = null;
    let activeEntries = [];
    const channelButtonMap = {};

    async function fetchSpawns() {
        console.log("Loading data from Supabase...");
        const { data, error } = await _supabase.from('boss_spawns_limited').select('*').range(0, 999);
        
        if (error) {
            console.error("Supabase Error:", error);
            return;
        }

        if (data) {
            activeEntries = data.map(item => ({
                id: item.id, 
                map: item.map, 
                boss: item.boss, 
                channel: item.channel,
                endTime: item.end_time ? new Date(item.end_time).getTime() : 0, 
                lastKillTime: item.last_kill_time ? new Date(item.last_kill_time).getTime() : 0,
                isMissed: item.is_missed || false,
                missedCount: item.missed_count || 0
            }));
            rebuildTable();
        }
    }

    _supabase.channel('public:boss_spawns_limited').on('postgres_changes', { event: '*', schema: 'public', table: 'boss_spawns_limited' }, () => { fetchSpawns(); }).subscribe();

    for (let i = 1; i <= 15; i++) {
        const chBtn = document.createElement('button');
        chBtn.className = 'channel-btn';
        chBtn.innerText = `Ch. ${i}`;
        const channelName = `Channel ${i}`;
        chBtn.dataset.channel = channelName;
        channelButtonMap[channelName] = chBtn;
        chBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            if (activeChannelButton) activeChannelButton.classList.remove('active');
            chBtn.classList.add('active');
            activeChannelButton = chBtn;
            const nowIso = new Date().toISOString();
            const fourHoursLater = new Date(Date.now() + (4 * 60 * 60 * 1000)).toISOString();
            await _supabase.from('boss_spawns_limited').upsert({ 
                map: currentSelectedMap, boss: currentSelectedBoss, channel: channelName, 
                end_time: fourHoursLater, last_kill_time: nowIso, is_missed: false, missed_count: 0 
            }, { onConflict: 'map,boss,channel' });
        });
        channelContainer.appendChild(chBtn);
    }

    Object.keys(cabalData).forEach(mapName => {
        const mapBtn = document.createElement('button');
        mapBtn.className = 'map-btn';
        mapBtn.innerText = mapName;
        mapBtn.addEventListener('click', () => {
            if (activeMapButton === mapBtn) {
                bossWrapper.classList.remove('visible'); channelWrapper.classList.remove('visible'); mapBtn.classList.remove('active');
                activeMapButton = null; activeBossButton = null; activeChannelButton = null;
                currentSelectedMap = null; currentSelectedBoss = null; updateChannelHighlights(); return;
            }
            if (activeMapButton) activeMapButton.classList.remove('active');
            mapBtn.classList.add('active'); activeMapButton = mapBtn; currentSelectedMap = mapName;
            bossContainer.innerHTML = '';
            cabalData[mapName].forEach(boss => {
                const bossBtn = document.createElement('button');
                bossBtn.className = 'boss-btn';
                bossBtn.innerText = boss.name;
                bossBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (activeBossButton) activeBossButton.classList.remove('active');
                    bossBtn.classList.add('active'); activeBossButton = bossBtn; currentSelectedBoss = boss.name;
                    channelWrapper.classList.add('visible'); updateChannelHighlights();
                });
                bossContainer.appendChild(bossBtn);
            });
            bossWrapper.classList.add('visible');
        });
        mapContainer.appendChild(mapBtn);
    });

    window.killTimer = async function(id) {
        const nowIso = new Date().toISOString();
        const fourHoursLater = new Date(Date.now() + (4 * 60 * 60 * 1000)).toISOString();
        await _supabase.from('boss_spawns_limited').update({ 
            end_time: fourHoursLater, 
            last_kill_time: nowIso,
            is_missed: false, 
            missed_count: 0 
        }).eq('id', id);
    };

    window.forceResetTimer = async function(id) {
        const entry = activeEntries.find(e => e.id === id);
        if (!entry) return;
        
        let newEndTime = entry.endTime;
        const now = Date.now();
        
        while (newEndTime <= now) {
            newEndTime += 4 * 60 * 60 * 1000;
        }

        await _supabase.from('boss_spawns_limited').update({ 
            end_time: new Date(newEndTime).toISOString(), 
            is_missed: true,
            missed_count: (entry.missedCount || 0) + 1
        }).eq('id', id);
    };

    window.deleteSpawn = async function(id) { 
        await _supabase.from('boss_spawns_limited').delete().eq('id', id); 
    };

    function updateChannelHighlights() {
        Object.values(channelButtonMap).forEach(btn => btn.classList.remove('has-spawn'));
        if (!currentSelectedMap || !currentSelectedBoss) return;
        activeEntries.filter(e => e.map === currentSelectedMap && e.boss === currentSelectedBoss)
                     .forEach(e => { if (channelButtonMap[e.channel]) channelButtonMap[e.channel].classList.add('has-spawn'); });
    }

    function formatTimeLeft(ms) {
        const isNegative = ms < 0;
        const absMs = Math.abs(ms);
        let totalSeconds = Math.floor(absMs / 1000);
        let hours = Math.floor(totalSeconds / 3600), minutes = Math.floor((totalSeconds % 3600) / 60), seconds = totalSeconds % 60;
        const timeStr = [hours.toString().padStart(2, '0'), minutes.toString().padStart(2, '0'), seconds.toString().padStart(2, '0')].join(':');
        return isNegative ? `-${timeStr}` : timeStr;
    }

    function formatDateTime(date) {
        const day = String(date.getDate()).padStart(2, '0');
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        const hours = String(date.getHours()).padStart(2, '0');
        const minutes = String(date.getMinutes()).padStart(2, '0');
        const seconds = String(date.getSeconds()).padStart(2, '0');
        return `${day}.${month}.${year}, ${hours}:${minutes}:${seconds}`;
    }

    function rebuildTable() {
        trackerTableBody.innerHTML = '';
        if (activeEntries.length === 0) {
            trackerTableBody.innerHTML = `<tr><td colspan="7" class="empty-table">No active entries. Select Map -> Boss -> Channel.</td></tr>`;
            updateChannelHighlights(); return;
        }
        activeEntries.sort((a, b) => a.endTime - b.endTime).forEach(entry => {
            const tr = document.createElement('tr');
            tr.id = `row-${entry.id}`;
            if (entry.isMissed) tr.classList.add('missed-row');

            const lastKillStr = entry.lastKillTime ? formatDateTime(new Date(entry.lastKillTime)) : '-';

            tr.innerHTML = `
                <td>${entry.map}</td>
                <td><span class="boss-name-span">${entry.boss}</span>${entry.isMissed ? '<span class="missed-badge">⚠️ Missed</span>' : ''}</td>
                <td>${entry.channel}</td>
                <td><span class="missed-count-badge">${entry.missedCount}</span></td>
                <td class="timestamp-cell">${lastKillStr}</td>
                <td class="timer-cell">--:--:--</td>
                <td>
                    <div class="action-buttons">
                        <button class="kill-btn" onclick="killTimer('${entry.id}')">Kill</button>
                        <button class="force-btn" onclick="forceResetTimer('${entry.id}')">Force Miss</button>
                        <button class="delete-btn" onclick="deleteSpawn('${entry.id}')">🗑️ Delete</button>
                    </div>
                </td>`;
            trackerTableBody.appendChild(tr);
        });
        updateTableValues();
    }

    function updateTableValues() {
        if (activeEntries.length === 0) return;
        
        activeEntries.forEach(entry => {
            const tr = document.getElementById(`row-${entry.id}`);
            if (!tr) return;
            
            const timeLeftMs = entry.endTime - Date.now();
            
            tr.classList.toggle('missed-row', entry.isMissed);
            
            const cell = tr.querySelector('.timer-cell');
            if (cell) {
                cell.innerText = formatTimeLeft(timeLeftMs);
                cell.className = `timer-cell ${timeLeftMs < 0 ? 'negative' : ''}`;
            }
            
            const forceBtn = tr.querySelector('.force-btn');
            if (forceBtn) forceBtn.disabled = !(timeLeftMs < 0);
        });
        
        updateChannelHighlights();
    }

    fetchSpawns();
    setInterval(updateTableValues, 1000);
    </script>
</body>
</html>
